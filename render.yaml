services:
  - type: web
    name: gauge-ai-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile.render
    healthCheckPath: /ready
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gauge-ai-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: BASE_URL
        sync: false

databases:
  - name: gauge-ai-db
    plan: free
    region: singapore
    ipAllowList: []
