services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gauge
      POSTGRES_DB: gauge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gauge]
      interval: 3s
      retries: 20
  migrate:
    image: gauge:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gauge:${POSTGRES_PASSWORD}@db:5432/gauge
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  web:
    image: gauge:local
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gauge:${POSTGRES_PASSWORD}@db:5432/gauge
    ports: ['127.0.0.1:9200:9200']
    depends_on:
      migrate: {condition: service_completed_successfully}
    init: true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9200/ready',timeout=5)"]
      interval: 10s
      retries: 10
  worker:
    image: gauge:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gauge:${POSTGRES_PASSWORD}@db:5432/gauge
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    init: true
volumes:
  postgres-data:
