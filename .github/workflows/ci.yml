name: Verify Gauge
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gauge
          POSTGRES_PASSWORD: gauge-test
          POSTGRES_DB: gauge_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U gauge' --health-interval 5s --health-retries 10
    env:
      ADMIN_KEY: ci-only-operator-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.6'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://gauge:gauge-test@localhost:5432/gauge_test
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash scripts/e2e.sh
